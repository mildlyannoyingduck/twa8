name: Build This Week Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configure preinstalled Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Cache persistent Android debug keystore for in-place APK updates
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: thisweek-debug-keystore-v1

      - name: Install web dependencies
        run: npm install --legacy-peer-deps

      - name: Build production web bundle
        run: npm run build

      - name: Install Capacitor Android packages
        run: npm install --no-save --legacy-peer-deps @capacitor/core@^6.2.0 @capacitor/cli@^6.2.0 @capacitor/android@^6.2.0

      - name: Generate Android project
        run: |
          rm -rf android
          npx cap add android

      - name: Inject native Samsung Galaxy A07 blocker, alarms & v3.1.2 config & icon
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-pil
          python3 native-android/patch_android.py

      - name: Sync Capacitor assets
        run: npx cap sync android

      - name: Build Debug APK
        run: |
          cat android/app/src/main/AndroidManifest.xml
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ThisWeek-GalaxyA07-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
